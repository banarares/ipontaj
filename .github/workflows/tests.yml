name: Verificări iPontaj
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, pgsql, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ipontaj_test
          MYSQL_USER: ipontaj
          MYSQL_PASSWORD: local_test_only
          MYSQL_ROOT_PASSWORD: local_root_test_only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -plocal_root_test_only"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ipontaj_test
          POSTGRES_USER: ipontaj
          POSTGRES_PASSWORD: local_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'mysql' && '3306' || '5432' }}
      DB_DATABASE: ${{ matrix.database != 'sqlite' && 'ipontaj_test' || ':memory:' }}
      DB_USERNAME: ipontaj
      DB_PASSWORD: local_test_only
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, intl, gd, zip, bcmath
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: python3 scripts/check-secrets.py
      - run: python3 scripts/test-check-secrets.py
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: npm run test:passwords
      - run: npm run test:cookies
      - run: npm run types:check
      - run: npm run check
      - run: composer lint:check
      - run: composer types:check
      - run: php artisan test

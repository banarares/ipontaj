name: Fluxuri în browser
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, gd, zip, bcmath
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate && php artisan migrate --force
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verifică fluxurile în browser
        run: |
          php artisan serve --host=127.0.0.1 --port=8765 > /tmp/ipontaj-server.log 2>&1 &
          ipontaj_server_pid=$!
          trap 'kill "$ipontaj_server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/up > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser/password-and-names.mjs
          node tests/browser/smoke.mjs
          node tests/browser/owner-employee.mjs
          node tests/browser/company-lookup.mjs
          node tests/browser/legal.mjs
